name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (finance engine, bank connectors, AI assistant)
        run: ./gradlew :core:test :connectors:test :assistant:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Signs with a throwaway key made the same way as the release SIGNING_KEY, so the signing setup
      # the release workflow depends on is checked on every push.
      - name: Build release APK (minified, signed)
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/ci.p12" -alias nexusbudget \
            -keyalg RSA -keysize 2048 -validity 1 -storepass nexusbudget -dname "CN=CI"
          NEXUS_KEYSTORE_FILE="$RUNNER_TEMP/ci.p12" ./gradlew :app:assembleRelease
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "CN=CI"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-budget-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  ui-test:
    # Launches the app on an emulator, loads demo data and opens every screen.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run UI smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # On failure, print the app's warnings and errors before the emulator shuts down.
          script: ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d '*:W' | grep -vE 'chatty|GoogleApiManager|Finsky|GmsClient' | tail -250; exit 1)

      - name: Print test results
        if: failure()
        run: find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} + || true

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
          if-no-files-found: warn
